{# Cores do tema (aba Identidade Visual), injetadas como variáveis CSS.
   Compartilhado pela loja (index.html) e pelo painel de atendimento
   (atendimento.html): os dois saem com as cores da loja sem duplicar a lista. #}
  <style>:root{
    --primary-yellow: {{ config.theme_primary_color or '#FFD60A' }};
    --yellow-soft: {{ config.theme_primary_grad_end or '#ffe45e' }};
    --primary-rgb: {{ (config.theme_primary_color or '#FFD60A') | hex_to_rgb }};
    --accent-rgb: {{ (config.theme_accent_color or '#7c3aed') | hex_to_rgb }};
    --accent-soft-rgb: {{ (config.theme_accent_soft_color or '#a855f7') | hex_to_rgb }};
    --btn-grad-angle: {{ config.theme_grad_angle or '120' }}deg;
    --text-on-primary: {{ config.theme_text_on_primary_color or '#000000' }};
    --bg: {{ config.theme_bg_color or '#0d0d1a' }};
    --bg-rgb: {{ (config.theme_bg_color or '#0d0d1a') | hex_to_rgb }};
    --card-bg: {{ config.theme_card_bg_color or '#1a1a2e' }};
    --text: {{ config.theme_text_color or '#ffffff' }};
    --surface: {{ config.theme_surface_color or '#17151c' }};
    --surface-2: {{ config.theme_surface_2_color or '#1e1b26' }};
    --border: {{ config.theme_border_color or '#29262f' }};
    --purple: {{ config.theme_accent_color or '#7c3aed' }};
    --purple-soft: {{ config.theme_accent_soft_color or '#a855f7' }};
    --text-dim: {{ config.theme_text_dim_color or '#9a97a5' }};
    --price-color: {{ config.theme_price_color or config.theme_primary_color or '#FFD60A' }};
    --arrow-color: {{ config.theme_arrow_color or config.theme_primary_color or '#FFD60A' }};
    --arrow-rgb: {{ (config.theme_arrow_color or config.theme_primary_color or '#FFD60A') | hex_to_rgb }};
    --ring-rgb: {{ (config.theme_ring_color or config.theme_primary_color or '#FFD60A') | hex_to_rgb }};
    {# Injeta a cor CRUA. O style.css clareia por cima (--label-lift) para o
       contraste passar em AA sem desrespeitar a escolha do painel. #}
    --brand-label-raw: {{ config.theme_brand_label_color or config.theme_accent_soft_color or '#a855f7' }};
    --flavor-more-raw: {{ config.theme_flavor_more_color or config.theme_accent_soft_color or '#a855f7' }};
  }</style>
